<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>GreenBasket Admin – Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0b7a4b;--gd:#066b41;--gl:#e5f3ec;--y:#ffc107;--bg:#f4f4f4;--tx:#1d1d1d;--mu:#5f5f5f;--ln:#e2e2e2;--err:#b3261e;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;min-height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0)}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
header{background:var(--g);color:#fff;padding:calc(14px + env(safe-area-inset-top,0)) 24px 14px;font-weight:700;font-size:18px;display:flex;gap:10px;align-items:center}
header span{background:var(--y);color:#222;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px}
main{flex:1;display:grid;place-items:center;padding:28px 16px}
.card{background:#fff;border-radius:12px;width:min(440px,100%);padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.07)}
h1{font-size:22px;margin-bottom:6px}
.sub{color:var(--mu);font-size:14px;margin-bottom:20px;line-height:1.5}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:30px;padding:4px;margin-bottom:22px}
.tabs button{border:0;background:none;padding:10px;border-radius:26px;font:inherit;font-weight:600;color:var(--mu);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--g);color:#fff}
label{display:block;font-size:13px;font-weight:600;margin-bottom:14px}
input{width:100%;margin-top:6px;padding:12px;border:1px solid var(--ln);border-radius:8px;font:inherit;background:#fff;color:var(--tx)}
input:focus{border-color:var(--g)}
.hint{font-weight:400;color:var(--mu);font-size:12px;margin-top:4px;display:block}
.btn{width:100%;border:0;background:var(--g);color:#fff;font:inherit;font-weight:600;padding:13px;border-radius:30px;cursor:pointer;margin-top:6px}
.btn:hover{background:var(--gd)}.btn[disabled]{opacity:.55;cursor:not-allowed}
.err{color:var(--err);font-size:14px;min-height:20px;margin:2px 0 8px}
.note{text-align:center;color:var(--mu);font-size:12px;margin-top:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>GreenBasket <span>Admin</span></header>
<main>
<div class="card">
  <h1 id="title">Sign in</h1>
  <p class="sub" id="sub">Store staff only. Sign in to manage products and orders.</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="t1" aria-selected="true" aria-controls="f1">Sign in</button>
    <button role="tab" id="t2" aria-selected="false" aria-controls="f2">Create account</button>
  </div>

  <form id="f1" role="tabpanel" aria-labelledby="t1" novalidate>
    <label>Email<input type="email" name="email" autocomplete="username" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <div class="err" role="alert" id="e1"></div>
    <button class="btn" type="submit">Sign in</button>
  </form>

  <form id="f2" role="tabpanel" aria-labelledby="t2" hidden novalidate>
    <label>Your name<input name="name" autocomplete="name" required></label>
    <label>Email<input type="email" name="email" autocomplete="username" required></label>
    <label>Password<input type="password" name="password" autocomplete="new-password" minlength="10" required>
      <span class="hint">At least 10 characters.</span></label>
    <label>Setup key<input type="password" name="setupKey" autocomplete="off" required>
      <span class="hint">The secret key set as ADMIN_SETUP_KEY in Cloudflare. Without it, nobody can create an account.</span></label>
    <div class="err" role="alert" id="e2"></div>
    <button class="btn" type="submit">Create account</button>
  </form>
  <p class="note">This page is not linked from the shop.</p>
</div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
function tab(n){
  $("t1").setAttribute("aria-selected",n===1);$("t2").setAttribute("aria-selected",n===2);
  $("f1").hidden=n!==1;$("f2").hidden=n!==2;
  $("title").textContent=n===1?"Sign in":"Create admin account";
  $("sub").textContent=n===1?"Store staff only. Sign in to manage products and orders.":"Use this once for each staff member. You need the setup key from the shop owner.";
}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
function send(url,form,errBox){
  var btn=form.querySelector("button[type=submit]"),data={};
  [].forEach.call(form.elements,function(el){if(el.name)data[el.name]=el.value});
  errBox.textContent="";
  for(var i=0;i<form.elements.length;i++){var el=form.elements[i];if(el.required&&!el.value.trim()){errBox.textContent="Fill in every field.";el.focus();return}}
  btn.disabled=true;
  fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})
   .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
   .then(function(x){
     if(x.ok){location.href="/admin/app"}
     else{errBox.textContent=x.j.error||"Something went wrong.";btn.disabled=false}
   }).catch(function(){errBox.textContent="No connection. Check your internet and try again.";btn.disabled=false});
}
$("f1").onsubmit=function(e){e.preventDefault();send("/api/auth/login",this,$("e1"))};
$("f2").onsubmit=function(e){e.preventDefault();send("/api/auth/register",this,$("e2"))};
fetch("/api/auth/me").then(function(r){return r.json()}).then(function(j){if(j.admin)location.href="/admin/app"}).catch(function(){});
</script>
</body>
</html>
